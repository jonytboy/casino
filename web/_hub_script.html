<script>
const GAMES = __GAMES__;
const STORE = __STORE__;
/* Where the authoritative server lives. null means there isn't one: the page
   then plays locally so it still works as a demo, and says so plainly rather
   than pretending the balance means anything. An empty string is not that --
   it means the server is this page's own origin, which is how the hosted build
   ships -- so every test here is against null, never truthiness. */
const API = __API__;

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("en-GB");
const BETS = [1, 2, 5, 10, 25, 50];
const GAP = 4, PADDING = 4, FILLER = 20;
const FREE_COINS = 2000, FREE_EVERY = 15 * 60 * 1000;

/* ---------- the wallet ----------------------------------------------------
   Two engines behind one interface.

   LocalEngine spins in the browser and keeps the balance in localStorage. That
   is honest for play money and worthless for anything sold, because a player
   can edit it — so it is the demo mode, and the page labels itself as such.

   ServerEngine asks the API for every spin and never computes an outcome. The
   server owns the balance, the strips and the randomness. */

let engine = null, purse = { coins: 0, freeReadyAt: 0 }, AUTO_ROUNDS = 100;
function paintPurse() { $("purse").textContent = fmt(purse.coins); }

const LOCAL_KEY = "exuma.purse.v1";
const START_COINS_LOCAL = 10000;

const LocalEngine = {
  mode: "local",
  async init() {
    let stored = { coins: START_COINS_LOCAL, freeReadyAt: 0 };
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (raw) stored = { ...stored, ...JSON.parse(raw) };
    } catch (e) { /* blocked or unavailable — carry on unsaved */ }
    purse = stored;
    return { games: GAMES, bets: BETS };
  },
  save() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(purse)); } catch (e) {}
  },
  async spin(key, betPerLine) {
    const g = GAMES[key];
    const stake = betPerLine * g.lines.length;
    if (purse.coins < stake) return { error: "insufficient_coins" };
    const window = spinWindow(g);
    const res = evaluateLocal(g, window, betPerLine);
    purse.coins += res.win - stake;
    this.save();
    return { window, stake, win: res.win, lit: res.lit, coins: purse.coins,
             scatters: res.scatters, freeSpins: res.freeSpins };
  },
  async claimFree() {
    if (purse.freeReadyAt > Date.now()) return { error: "too_soon", waitMs: purse.freeReadyAt - Date.now() };
    purse.coins += FREE_COINS;
    purse.freeReadyAt = Date.now() + FREE_EVERY;
    this.save();
    return { coins: purse.coins, freeReadyAt: purse.freeReadyAt };
  },
};

const ServerEngine = {
  mode: "server",
  token: null,
  async call(path, opts = {}) {
    const headers = { "content-type": "application/json", ...(opts.headers || {}) };
    if (this.token) headers.authorization = `Bearer ${this.token}`;
    const r = await fetch(API + path, { ...opts, headers });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) return { error: body.error || `http_${r.status}`, ...body };
    return body;
  },
  async init() {
    try { this.token = localStorage.getItem("exuma.token"); } catch (e) {}
    const s = await this.call("/api/session", { method: "POST" });
    if (s.error) throw new Error(s.error);
    if (s.token) {
      this.token = s.token;
      try { localStorage.setItem("exuma.token", s.token); } catch (e) {}
    }
    purse = { coins: s.coins, freeReadyAt: s.freeReadyAt };
    // The server is the source of truth for the reels too, so take its copy.
    const games = {};
    for (const g of s.games) {
      const local = GAMES[g.key] || {};
      games[g.key] = { ...local, key: g.key, cfg: g.cfg, lines: g.lines,
                       title: g.title, rtp: (g.rtp * 100).toFixed(2) + "%" };
    }
    return { games, bets: s.bets || BETS };
  },
  async spin(key, betPerLine) {
    const r = await this.call("/api/spin", {
      method: "POST", body: JSON.stringify({ game: key, betPerLine }),
    });
    if (!r.error) purse.coins = r.coins;
    return r;
  },
  async claimFree() {
    const r = await this.call("/api/free", { method: "POST" });
    if (!r.error) { purse.coins = r.coins; purse.freeReadyAt = r.freeReadyAt; }
    return r;
  },
};

/* ---------- audio ---------- */
const LEVELS = { spin: .32, won: .6, coin: .5, chest: .65, nudge: .4, warning: .45 };
let AUDIO = {}, soundOn = true, HAS_SOUND = false;
function loadAudio(game) {
  AUDIO = {};
  HAS_SOUND = Object.keys(game.sfx).length > 0;
  for (const [name, src] of Object.entries(game.sfx)) {
    const a = new Audio(src);
    a.preload = "auto"; a.volume = LEVELS[name] ?? .5;
    AUDIO[name] = a;
  }
}
function play(name, loop) {
  if (!soundOn || !AUDIO[name]) return;
  const base = AUDIO[name];
  if (loop) { base.loop = true; base.currentTime = 0; base.play().catch(() => {}); return; }
  const one = base.cloneNode(); one.volume = base.volume; one.play().catch(() => {});
}
function stopSound(name) {
  const a = AUDIO[name];
  if (a) { a.pause(); a.loop = false; a.currentTime = 0; }
}

/* ---------- maths: identical to the verified Python model ---------- */
let G = null, CFG = null, LINES = null, ART = null, PAYING = null;

function lineWin(combo) {
  if (CFG.rule === "leftmost_nonwild") {
    let value = CFG.wild;
    for (const c of combo) { if (c !== CFG.wild) { value = c; break; } }
    let run = 0;
    for (const c of combo) { if (c === value || c === CFG.wild) run++; else break; }
    return run >= 2 ? ((CFG.paytable[value] || {})[run] || 0) : 0;
  }
  let best = 0;
  for (const sym of PAYING) {
    let run = 0;
    for (const c of combo) { if (c === sym || c === CFG.wild) run++; else break; }
    if (run >= 2) best = Math.max(best, (CFG.paytable[sym] || {})[run] || 0);
  }
  return best;
}
function winRun(combo) {
  if (CFG.rule === "leftmost_nonwild") {
    let value = CFG.wild;
    for (const c of combo) { if (c !== CFG.wild) { value = c; break; } }
    let run = 0;
    for (const c of combo) { if (c === value || c === CFG.wild) run++; else break; }
    return run;
  }
  const pay = lineWin(combo);
  for (const sym of PAYING) {
    let run = 0;
    for (const c of combo) { if (c === sym || c === CFG.wild) run++; else break; }
    if (run >= 2 && ((CFG.paytable[sym] || {})[run] || 0) === pay) return run;
  }
  return 0;
}
function spinWindow(g) {
  const cfg = g ? g.cfg : CFG;
  return cfg.reels.map(strip => {
    const stop = Math.floor(Math.random() * strip.length);
    return Array.from({ length: cfg.rows }, (_, r) => strip[(stop + r) % strip.length]);
  });
}
function evaluateLocal(g, win, betPerLine) {
  const prevCfg = CFG, prevLines = LINES, prevPaying = PAYING;
  CFG = g.cfg; LINES = g.lines;
  PAYING = CFG.symbols.filter(s => s !== CFG.wild && s !== CFG.scatter);
  const out = evaluate(win, betPerLine);
  CFG = prevCfg; LINES = prevLines; PAYING = prevPaying;
  return out;
}
function evaluate(win, betPerLine) {
  let total = 0; const lit = [];
  for (const line of LINES) {
    const combo = line.map((row, reel) => win[reel][row]);
    const pay = lineWin(combo);
    if (pay > 0) {
      total += pay;
      const run = winRun(combo);
      for (let reel = 0; reel < run; reel++) lit.push([reel, line[reel]]);
    }
  }
  const scatters = win.reduce((n, col) => n + col.filter(s => s === CFG.scatter).length, 0);
  const mult = (CFG.scatter_pays || {})[scatters] || 0;
  const win_ = total * betPerLine + mult * betPerLine * LINES.length;
  return { win: win_, total: win_, lit, scatters,
           freeSpins: (CFG.scatter_spins || {})[scatters] || 0 };
}

/* ---------- reels ---------- */
let CELL = 60, STEP = 64, currentWindow = null;
const reelEls = [];
function buildReels() {
  $("reels").innerHTML = ""; reelEls.length = 0;
  for (let r = 0; r < CFG.reels.length; r++) {
    const reel = document.createElement("div"); reel.className = "reel";
    const cells = document.createElement("div"); cells.className = "cells";
    reel.appendChild(cells); $("reels").appendChild(reel);
    reelEls.push({ reel, cells });
  }
}
function sizeReels() {
  if (!reelEls.length) return;
  CELL = Math.max(26, Math.round(reelEls[0].reel.clientWidth - PADDING * 2));
  STEP = CELL + GAP;
  document.documentElement.style.setProperty("--cell", CELL + "px");
}
function makeCell(sym) {
  const cell = document.createElement("div"); cell.className = "cell";
  const img = document.createElement("img"); img.src = ART[sym]; img.alt = sym;
  cell.appendChild(img); return cell;
}
function fillColumn(i, result, filler) {
  const { cells } = reelEls[i], strip = CFG.reels[i];
  cells.innerHTML = "";
  result.forEach(s => cells.appendChild(makeCell(s)));
  for (let k = 0; k < filler; k++) cells.appendChild(makeCell(strip[Math.floor(Math.random() * strip.length)]));
  return filler;
}
function highlight(lit) {
  const key = new Set((lit || []).map(([a, b]) => a + ":" + b));
  reelEls.forEach(({ cells }, reel) => {
    for (let row = 0; row < CFG.rows; row++) {
      const c = cells.children[row];
      if (c) c.classList.toggle("lit", key.has(reel + ":" + row));
    }
  });
}
function paint(win, lit) {
  currentWindow = win;
  win.forEach((col, reel) => { fillColumn(reel, col, 0); reelEls[reel].cells.style.transform = "translateY(0px)"; });
  highlight(lit);
}
function animateReels(win) {
  currentWindow = win;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { paint(win, []); return Promise.resolve(); }
  return Promise.all(win.map((col, reel) => {
    const { cells } = reelEls[reel];
    const filler = fillColumn(reel, col, FILLER);
    const from = -(filler * STEP);
    cells.style.transform = `translateY(${from}px)`;
    cells.classList.add("fast");
    const anim = cells.animate(
      [{ transform: `translateY(${from}px)` }, { transform: "translateY(0px)" }],
      { duration: 620 + reel * 170, easing: "cubic-bezier(.17,.67,.21,1)", fill: "forwards" });
    setTimeout(() => cells.classList.remove("fast"), 420 + reel * 170);
    return anim.finished.then(() => { cells.style.transform = "translateY(0px)"; });
  }));
}

/* ---------- session ---------- */
let betIdx = 1, spins = 0, staked = 0, returned = 0, best = 0, busy = false, warned = false;

function refresh() {
  const bet = BETS[betIdx], stake = bet * LINES.length;
  $("bet").textContent = bet;
  $("stake").textContent = fmt(stake);
  $("lineCount").textContent = LINES.length;
  $("spins").textContent = fmt(spins);
  $("staked").textContent = fmt(staked);
  $("returned").textContent = fmt(returned);
  $("best").textContent = fmt(best);
  const rtp = staked ? returned / staked * 100 : null;
  $("liveRtp").textContent = rtp === null ? "—" : rtp.toFixed(2) + "%";
  const broke = purse.coins < stake;
  if (broke && !warned) { warned = true; play("warning"); showTopup(); }
  if (!broke) warned = false;
  $("spin").disabled = busy || broke;
  $("auto").disabled = busy || broke;
  $("down").disabled = busy || betIdx === 0;
  $("up").disabled = busy || betIdx === BETS.length - 1;
  paintPurse();
}

function settle(res, stake) {
  if (res.win > best) best = res.win;
  if (res.freeSpins) play("chest");
  else if (res.win > 0) { play("won"); setTimeout(() => play("coin"), 260); }
  highlight(res.lit);
  $("lastwin").textContent = fmt(res.win);
  const b = $("banner");
  if (res.freeSpins) { b.textContent = res.scatters + " Bonus — " + fmt(res.win); b.classList.add("show"); }
  else if (res.win >= stake * 10) { b.textContent = "Big win — " + fmt(res.win); b.classList.add("show"); }
  else if (res.win > 0) { b.textContent = "Pays " + fmt(res.win); b.classList.add("show"); }
  else b.classList.remove("show");
  refresh();
}

async function doSpin() {
  const bet = BETS[betIdx], stake = bet * LINES.length;
  if (busy) return;
  busy = true; refresh();
  $("banner").classList.remove("show");

  // The result is decided before the reels move. In server mode that means the
  // outcome is already committed and the animation is only presentation.
  const res = await engine.spin(G.key, bet);
  if (res.error) {
    busy = false;
    if (res.error === "insufficient_coins") { play("warning"); showTopup(); }
    else if (res.error !== "too_soon") notify(res.error);
    refresh();
    return;
  }
  spins++; staked += res.stake; returned += res.win;
  play("spin", true);
  await animateReels(res.window);
  stopSound("spin");
  busy = false;
  settle(res, res.stake);
}

function notify(code) {
  const b = $("banner");
  b.textContent = code === "slow_down" ? "Slow down a moment" : "Connection problem";
  b.classList.add("show");
}

/* ---------- views ---------- */
function show(view) {
  for (const id of ["lobby", "machine", "topup"]) $(id).classList.toggle("hidden", id !== view);
  $("lobbyBtn").classList.toggle("hidden", view === "lobby");
}
function showTopup() { show("topup"); }

function openGame(key) {
  G = GAMES[key];
  CFG = G.cfg; LINES = G.lines; ART = G.art;
  PAYING = CFG.symbols.filter(s => s !== CFG.wild && s !== CFG.scatter);
  loadAudio(G);
  soundOn = HAS_SOUND;
  spins = staked = returned = best = 0; busy = false; warned = false;
  $("assayTitle").textContent = G.title;
  $("assayNote").textContent = "Return computed exactly over all " + G.windows + " reel positions — not sampled.";
  $("verified").textContent = G.rtp;
  $("rules").textContent = G.rules;
  $("lastwin").textContent = "0";
  $("banner").classList.remove("show");
  $("mute").hidden = !HAS_SOUND;
  if (HAS_SOUND) $("muteIcon").src = G.icons.on;
  buildReels();
  show("machine");
  requestAnimationFrame(() => { sizeReels(); paint(spinWindow(), []); refresh(); buildPaytable(); });
}

function buildPaytable() {
  const counts = [...new Set(PAYING.flatMap(s => Object.keys(CFG.paytable[s] || {}).map(Number)))].sort((a, b) => a - b);
  const rows = ["<tr><th>Symbol</th>" + counts.map(n => `<th>${n}</th>`).join("") + "</tr>"];
  for (const sym of PAYING) {
    const t = CFG.paytable[sym] || {};
    if (!Object.keys(t).length) continue;
    rows.push(`<tr><td><img src="${ART[sym]}" alt=""> ${G.names[sym] || sym}</td>` +
              counts.map(n => `<td>${t[n] ?? "–"}</td>`).join("") + "</tr>");
  }
  $("paytable").innerHTML = rows.join("");
}

function buildLobby() {
  const tiles = $("tiles"); tiles.innerHTML = "";
  for (const [key, g] of Object.entries(GAMES)) {
    const btn = document.createElement("button");
    btn.className = "tile";
    const peek = g.preview.map(s => `<img src="${g.art[s]}" alt="">`).join("");
    btn.innerHTML = `<div class="inner"><h2>${g.title}</h2><div class="strip">${peek}</div>
      <dl><dt>Verified return</dt><dd>${g.rtp}</dd>
      <dt>Paylines</dt><dd>${g.lines.length}</dd>
      <dt>Top award</dt><dd>${g.topAward}</dd></dl></div>`;
    btn.addEventListener("click", () => openGame(key));
    tiles.appendChild(btn);
  }
}

/* ---------- top up ---------- */
function buildPacks() {
  const packs = $("packs"); packs.innerHTML = "";
  const free = document.createElement("button");
  free.className = "pack free";
  packs.appendChild(free);
  const paintFree = () => {
    const wait = purse.freeReadyAt - Date.now();
    if (wait > 0) {
      const m = Math.floor(wait / 60000), s = Math.floor(wait % 60000 / 1000);
      free.innerHTML = `<span class="coins">${fmt(FREE_COINS)}</span><span class="price">again in ${m}:${String(s).padStart(2, "0")}</span>`;
      free.disabled = true;
    } else {
      free.innerHTML = `<span class="coins">${fmt(FREE_COINS)}</span><span class="price">free &middot; collect now</span>`;
      free.disabled = false;
    }
  };
  free.addEventListener("click", async () => {
    if (free.disabled) return;
    free.disabled = true;
    const r = await engine.claimFree();
    if (r.error) {
      // "too_soon" just means our clock ran ahead of the server's; the timer
      // below will re-enable the button when it is genuinely ready.
      if (r.waitMs) purse.freeReadyAt = Date.now() + r.waitMs;
      else if (r.error !== "too_soon") notify(r.error);
    } else {
      play("coin");
    }
    paintPurse(); paintFree(); refresh();
  });
  paintFree(); setInterval(paintFree, 1000);

  for (const p of STORE.packs) {
    const el = document.createElement("button");
    el.className = "pack";
    el.innerHTML = `<span class="coins">${fmt(p.coins)}</span><span class="price">${p.price}</span>`;
    if (STORE.checkoutBase) {
      el.addEventListener("click", () => window.open(STORE.checkoutBase + p.id, "_blank", "noopener"));
    } else {
      el.disabled = true;
    }
    packs.appendChild(el);
  }
  $("storeNote").textContent = STORE.checkoutBase
    ? "Purchases open in a new tab and are handled by the store."
    : "Coin packs are not on sale yet — the free top-up above keeps you playing.";
}

/* ---------- wiring ---------- */
$("spin").addEventListener("click", doSpin);
$("down").addEventListener("click", () => { if (betIdx > 0) { betIdx--; play("nudge"); } refresh(); });
$("up").addEventListener("click", () => { if (betIdx < BETS.length - 1) { betIdx++; play("nudge"); } refresh(); });
$("mute").addEventListener("click", () => {
  soundOn = !soundOn;
  if (!soundOn) stopSound("spin"); else play("nudge");
  $("muteIcon").src = soundOn ? G.icons.on : G.icons.off;
  $("mute").setAttribute("aria-pressed", String(soundOn));
});
$("auto").addEventListener("click", async () => {
  if (busy) return;
  busy = true; refresh();
  $("banner").classList.remove("show");
  // Each spin is a separate authorised bet, so they go one at a time. Over the
  // network that is slower than the old local burst, hence the smaller run.
  const rounds = AUTO_ROUNDS;
  const bet = BETS[betIdx];
  let last = null;
  for (let i = 0; i < rounds; i++) {
    const res = await engine.spin(G.key, bet);
    if (res.error) {
      if (res.error === "insufficient_coins") play("warning");
      else notify(res.error);
      break;
    }
    spins++; staked += res.stake; returned += res.win;
    if (res.win > best) best = res.win;
    last = res;
    paint(res.window, res.lit);
    $("lastwin").textContent = fmt(res.win);
    paintPurse();
  }
  busy = false;
  if (last) { if (last.win > 0) play("coin"); settle(last, last.stake); }
  else refresh();
  if (purse.coins < bet * LINES.length) showTopup();
});
$("lobbyBtn").addEventListener("click", () => { stopSound("spin"); show("lobby"); paintPurse(); });
$("topupBtn").addEventListener("click", showTopup);
addEventListener("resize", () => { if (!busy && currentWindow && G) { sizeReels(); paint(currentWindow, []); } });

async function boot() {
  let info = null;
  if (API !== null) {
    try {
      info = await ServerEngine.init();
      engine = ServerEngine;
    } catch (e) {
      // The API is configured but unreachable. Falling back keeps the page
      // usable, and the badge stops anyone mistaking it for a real balance.
      console.warn("server unavailable, playing locally:", e);
    }
  }
  if (!engine) {
    engine = LocalEngine;
    info = await LocalEngine.init();
  }
  Object.assign(GAMES, info.games);
  if (info.bets && info.bets.length) {
    BETS.splice(0, BETS.length, ...info.bets);
    betIdx = Math.min(betIdx, BETS.length - 1);
  }
  AUTO_ROUNDS = engine.mode === "server" ? 25 : 100;
  $("auto").textContent = "Auto-spin " + AUTO_ROUNDS;

  const badge = document.createElement("span");
  badge.className = "mode " + engine.mode;
  badge.textContent = engine.mode === "server" ? "live" : "demo \u00b7 local play";
  document.querySelector(".brand").after(badge);

  paintPurse(); buildLobby(); buildPacks(); show("lobby");
}
boot();
</script>
