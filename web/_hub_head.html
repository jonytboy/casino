<meta charset="utf-8">
<title>Exuma Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Karla:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root {
    --abyss:#0A1D23; --hull:#103038; --raised:#16414C; --brass:#C08B3E;
    --gold:#F4C860; --rope:#E3D5BC; --tide:#4E8A94; --blood:#A8433F;
    --frame:linear-gradient(170deg,#E0B970 0%,#A8752F 38%,#6E4A1C 100%);
    --step:clamp(.5rem,1.4vw,.9rem); color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;padding:clamp(.75rem,2.5vw,2rem);
    background:radial-gradient(120% 80% at 50% -10%,#1A4650 0%,transparent 60%),var(--abyss);
    color:var(--rope);font-family:Karla,"Helvetica Neue",Arial,sans-serif;line-height:1.55;
    display:flex;justify-content:center;
  }
  .shell{width:min(1080px,100%);display:flex;flex-direction:column;gap:calc(var(--step)*1.6)}
  .shell>*{flex:0 0 auto}

  /* ---- top bar: wallet lives here, above every view ---- */
  .bar{display:flex;align-items:center;gap:var(--step);flex-wrap:wrap;
       background:var(--hull);border:1px solid #1D4C57;border-radius:10px;padding:calc(var(--step)*.9) var(--step)}
  .brand{font-family:Cinzel,Georgia,serif;font-weight:800;letter-spacing:.06em;font-size:1.05rem;
         background:linear-gradient(178deg,#FBE7B4 8%,var(--gold) 40%,#9E6B26 100%);
         -webkit-background-clip:text;background-clip:text;color:transparent}
  .spacer{margin-right:auto}
  /* Says whether the balance is real. A demo badge is not decoration: it is
     the difference between play money and money. */
  .mode{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.58rem;letter-spacing:.16em;
        text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;border:1px solid;white-space:nowrap}
  .mode.server{color:#7BE0A8;border-color:#2C6B4A;background:#0E2A1E}
  .mode.local{color:var(--tide);border-color:#2A5A66;background:#0C2129}
  .purse{display:flex;align-items:baseline;gap:.5rem}
  .purse .label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.18em;
                text-transform:uppercase;color:var(--tide)}
  .purse .amount{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.3rem;
                 font-variant-numeric:tabular-nums;color:var(--gold)}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid #7A5A28;
         background:linear-gradient(180deg,var(--raised),#0D2A32);color:var(--rope);
         padding:.4rem .7rem;transition:filter .15s}
  button:hover:not(:disabled){filter:brightness(1.25)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button:disabled{opacity:.45;cursor:not-allowed}

  /* ---- lobby ---- */
  .lobby{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:calc(var(--step)*1.5)}
  .tile{background:var(--frame);padding:8px;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);
        border:none;text-align:left;display:block;width:100%}
  .tile .inner{background:var(--hull);border-radius:8px;padding:var(--step);display:flex;flex-direction:column;gap:.6rem}
  .tile h2{font-family:Cinzel,Georgia,serif;margin:0;font-size:1.15rem;letter-spacing:.05em;color:var(--gold)}
  .tile .strip{display:flex;gap:5px}
  /* flex children do not shrink below their content unless told to, so a
     width:100% image overflows the tile instead of sharing the row. */
  .tile .strip img{flex:1 1 0;min-width:0;width:auto;aspect-ratio:1;object-fit:contain;
                   background:#0B242B;border-radius:5px;padding:4px}
  .tile dl{margin:0;display:grid;grid-template-columns:auto auto;gap:.15rem .8rem;
           font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.72rem;font-variant-numeric:tabular-nums}
  .tile dt{color:var(--tide)} .tile dd{margin:0;text-align:right;color:var(--rope)}
  .lead{color:var(--tide);font-size:.92rem;max-width:62ch}

  /* ---- machine ---- */
  .cabinet{background:var(--frame);padding:10px;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .screen{background:var(--hull);border-radius:7px;padding:var(--step);position:relative;overflow:hidden}
  .reels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .reel{background:#0B242B;border-radius:5px;position:relative;overflow:hidden;
        height:calc(var(--cell,60px)*3 + 16px)}
  .cells{display:flex;flex-direction:column;gap:4px;padding:4px;will-change:transform}
  .cell{width:var(--cell,60px);height:var(--cell,60px);flex:0 0 auto;display:grid;place-items:center;
        border-radius:4px;background:linear-gradient(180deg,#15343D,#0E272E)}
  .cell img{width:84%;height:84%;object-fit:contain;display:block}
  .cell.lit{background:linear-gradient(180deg,#4A3512,#2B1F0A);box-shadow:inset 0 0 0 2px var(--gold)}
  .cells.fast img{filter:blur(3px)}
  .reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:16%;pointer-events:none;z-index:2}
  .reel::before{top:0;background:linear-gradient(#0B242B,transparent)}
  .reel::after{bottom:0;background:linear-gradient(transparent,#0B242B)}
  .banner{position:absolute;inset:auto 0 0 0;padding:.55rem;font-family:Cinzel,Georgia,serif;font-weight:600;
          text-align:center;letter-spacing:.1em;text-transform:uppercase;font-size:.9rem;
          background:linear-gradient(90deg,transparent,rgba(244,200,96,.22),transparent);
          color:var(--gold);opacity:0;transition:opacity .25s}
  .banner.show{opacity:1}
  .controls{display:flex;flex-wrap:wrap;gap:var(--step);align-items:end;margin-top:var(--step)}
  .field{display:flex;flex-direction:column;gap:.25rem}
  .label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.62rem;letter-spacing:.18em;
         text-transform:uppercase;color:var(--tide)}
  .value{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.3rem;
         font-variant-numeric:tabular-nums;color:var(--rope)}
  .value.win{color:var(--gold)}
  .stepper{display:flex;gap:4px;align-items:center}
  .mute{padding:0;border:none;background:none;line-height:0;border-radius:7px;align-self:center}
  .mute img{width:44px;height:auto;display:block;transition:filter .15s}
  .mute:hover img{filter:brightness(1.3)}
  .spin{margin-left:auto;font-family:Cinzel,Georgia,serif;font-weight:600;letter-spacing:.14em;
        text-transform:uppercase;font-size:1rem;padding:.75rem 2rem;color:#2A1B05;border-color:#E7C77E;
        background:linear-gradient(180deg,#FBE1A4,var(--brass))}

  /* ---- panels ---- */
  .panel{background:var(--hull);border:1px solid #1D4C57;border-radius:10px;padding:calc(var(--step)*1.4);
         display:flex;flex-direction:column;gap:.8rem;overflow-x:auto}
  .panel h2{font-family:Cinzel,Georgia,serif;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;
            margin:0;color:var(--brass)}
  .panel p{margin:0;font-size:.82rem;color:var(--tide)}
  .row{display:flex;justify-content:space-between;gap:.5rem;font-family:"IBM Plex Mono",ui-monospace,monospace;
       font-size:.82rem;font-variant-numeric:tabular-nums}
  .row span:first-child{color:var(--tide)}
  table{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",ui-monospace,monospace;
        font-size:.78rem;font-variant-numeric:tabular-nums}
  th{text-align:right;color:var(--tide);font-weight:400;padding:.25rem .4rem}
  th:first-child{text-align:left}
  td{text-align:right;padding:.25rem .4rem;border-top:1px solid #173A44}
  td:first-child{text-align:left;display:flex;align-items:center;gap:.5rem;color:var(--rope)}
  td img{width:22px;height:22px;object-fit:contain}

  /* ---- top-up ---- */
  .packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
  .pack{background:linear-gradient(180deg,var(--raised),#0D2A32);border:1px solid #265966;border-radius:9px;
        padding:.8rem;text-align:center;display:flex;flex-direction:column;gap:.3rem}
  .pack .coins{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.15rem;color:var(--gold);
               font-variant-numeric:tabular-nums}
  .pack .price{font-size:.8rem;color:var(--tide)}
  .free{background:linear-gradient(180deg,#2C6B4F,#17402F);border-color:#3E8A66}
  footer{color:var(--tide);font-size:.78rem;text-align:center;max-width:64ch;margin:0 auto}
  .hidden{display:none !important}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
